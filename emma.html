<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Emma</title>

<style>
body{margin:0;background:#0b1d4d;color:white;font-family:Arial;}
.header{padding:20px;text-align:center;font-size:32px;font-weight:bold;}
.chat{width:90%;max-width:800px;margin:auto;height:60vh;background:#16295f;border-radius:20px;padding:20px;overflow-y:auto;}
.input-area{width:90%;max-width:800px;margin:20px auto;display:flex;gap:10px;}
input{flex:1;padding:15px;border:none;border-radius:10px;font-size:16px;}
button{background:#ff4fa0;color:white;border:none;border-radius:10px;padding:15px 25px;cursor:pointer;}
.message{margin:10px 0;padding:12px;border-radius:10px;}
.user{background:#294189;}
.ai{background:#1d2f66;}
a{color:#ff4fa0;}
</style>
</head>

<body>

<div class="header">Emma ❤️</div>

<div class="chat" id="chat">
  <div class="message ai">
    Hello ❤️ I'm Emma. How was your day?
  </div>
</div>

<div class="input-area">
  <input id="message" placeholder="Type a message...">
  <button onclick="sendMessage()">Send</button>
</div>

<p style="text-align:center;">
  <a href="index.html">← Back to Love Boulevard</a>
</p>

<script>
async function sendMessage(){
  const input = document.getElementById("message");
  const text = input.value.trim();

  if(text === "") return;

  const chat = document.getElementById("chat");

  chat.innerHTML += `<div class="message user">${text}</div>`;
  input.value = "";

  chat.innerHTML += `<div class="message ai" id="loading">Emma is typing...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        character: "emma",
        message: text
      })
    });

    const data = await response.json();

    document.getElementById("loading").remove();

    if(data.reply){
      chat.innerHTML += `<div class="message ai">${data.reply}</div>`;
    } else {
      chat.innerHTML += `<div class="message ai">Sorry, I had a little problem answering.</div>`;
    }

  } catch (error) {
    document.getElementById("loading").remove();
    chat.innerHTML += `<div class="message ai">Connection error. Try again.</div>`;
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
