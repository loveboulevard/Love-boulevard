<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Boulevard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1b3d;
    color:white;
    text-align:center;
}

h1{
    margin-top:40px;
    font-size:72px;
}

.subtitle{
    color:#d4d4d4;
    margin-bottom:50px;
    font-size:22px;
}

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:20px;
}

.card{
    width:380px;
    background:#223266;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.card img{
    width:100%;
    height:520px;
    object-fit:cover;
}

.card-content{
    padding:25px;
}

.card h2{
    margin:0;
    font-size:24px;
}

.role{
    color:#bdbdbd;
    margin-top:10px;
    font-size:18px;
}

.description{
    margin-top:20px;
    min-height:60px;
    font-size:20px;
}

.chat-btn{
    display:inline-block;
    text-decoration:none;
    background:#ff4fa0;
    color:white;
    padding:14px 30px;
    border-radius:12px;
    font-weight:bold;
    margin-top:15px;
}

.chat-btn:hover{
    background:#ff2d89;
}
</style>
</head>

<body>

<h1>Love Boulevard</h1>
<p class="subtitle">Find your perfect AI companion</p>

<div class="container">

    <div class="card">
        <img src="emma.png" alt="Emma">
        <div class="card-content">
            <h2>Emma</h2>
            <p class="role">The Dreamer</p>
            <p class="description">
                Sweet, romantic and caring.
            </p>
            <a class="chat-btn" href="emma.html">
                Chat with Emma
            </a>
        </div>
    </div>

    <div class="card">
        <img src="valentina.png" alt="Valentina">
        <div class="card-content">
            <h2>Valentina</h2>
            <p class="role">The Spark</p>
            <p class="description">
                Passionate, playful and irresistible.
            </p>
            <a class="chat-btn" href="valentina.html">
                Chat with Valentina
            </a>
        </div>
    </div>

    <div class="card">
        <img src="sophia.png" alt="Sophia">
        <div class="card-content">
            <h2>Sophia</h2>
            <p class="role">The Muse</p>
            <p class="description">
                Elegant, intelligent and ambitious.
            </p>
            <a class="chat-btn" href="sophia.html">
                Chat with Sophia
            </a>
        </div>
    </div>

</div>

</body>
</html>
