<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Boulevard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1b3d;
    color:white;
    text-align:center;
}

h1{
    margin-top:60px;
    font-size:60px;
}

.subtitle{
    color:#cfcfcf;
    margin-bottom:50px;
}

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:20px;
}

.card{
    width:320px;
    background:#1c2b57;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.card img{
    width:100%;
    height:420px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h2{
    margin:0;
}

.role{
    color:#bbbbbb;
    margin:10px 0;
}

.description{
    min-height:50px;
}

button{
    background:#ff4fa0;
    border:none;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#ff2e8a;
}
</style>
</head>

<body>

<h1>Love Boulevard</h1>
<p class="subtitle">Find your perfect AI companion</p>

<div class="container">

    <div class="card">
        <img src="emma.png" alt="Emma">
        <div class="card-content">
            <h2>Emma</h2>
            <p class="role">The Dreamer</p>
            <p class="description">
                Sweet, romantic and caring.
            </p>
            <button>Chat with Emma</button>
        </div>
    </div>

    <div class="card">
        <img src="valentina.png" alt="Valentina">
        <div class="card-content">
            <h2>Valentina</h2>
            <p class="role">The Spark</p>
            <p class="description">
                Passionate, playful and irresistible.
            </p>
            <button>Chat with Valentina</button>
        </div>
    </div>

    <div class="card">
        <img src="sophia.png" alt="Sophia">
        <div class="card-content">
            <h2>Sophia</h2>
            <p class="role">The Muse</p>
            <p class="description">
                Elegant, intelligent and ambitious.
            </p>
            <button>Chat with Sophia</button>
        </div>
    </div>

</div>

</body>
</html>
