<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sophia</title>

<style>
body{margin:0;background:#0b1d4d;color:white;font-family:Arial;}
.header{padding:20px;text-align:center;font-size:32px;font-weight:bold;}
.chat{width:90%;max-width:800px;margin:auto;height:60vh;background:#16295f;border-radius:20px;padding:20px;overflow-y:auto;}
.input-area{width:90%;max-width:800px;margin:20px auto;display:flex;gap:10px;}
input{flex:1;padding:15px;border:none;border-radius:10px;font-size:16px;}
button{background:#ff4fa0;color:white;border:none;border-radius:10px;padding:15px 25px;cursor:pointer;}
.message{margin:10px 0;padding:10px;border-radius:10px;}
.user{background:#294189;}
.ai{background:#1d2f66;}
a{color:#ff4fa0;}
</style>
</head>

<body>

<div class="header">Sophia ✨</div>

<div class="chat" id="chat">
<div class="message ai">
Hello, I'm Sophia. I enjoy meaningful conversations.
</div>
</div>

<div class="input-area">
<input id="message" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

<p style="text-align:center;">
<a href="index.html">← Back to Love Boulevard</a>
</p>

<script>
function sendMessage(){
let text=document.getElementById("message").value;
if(text==="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`<div class="message user">${text}</div>`;

const replies=[
"Interesting perspective.",
"Tell me more.",
"I enjoy thoughtful conversations.",
"That's a fascinating idea.",
"You seem quite intelligent."
];

const response=replies[Math.floor(Math.random()*replies.length)];

chat.innerHTML+=`<div class="message ai">${response}</div>`;

document.getElementById("message").value="";
chat.scrollTop=chat.scrollHeight;
}
</script>

</body>
</html>
